raph</text><text x="40" y="124" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#fb923c">A RANKER FOR RELEVANCE, AN OPTIMIZER FOR PROFIT</text><rect class="st" x="40" y="152" width="260" height="24" rx="6" fill="#fb923c" stroke="#fb923c" stroke-opacity=".6" style="animation-delay:0.0s"/><text x="312" y="169" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8da2ba">150 candidates</text><rect class="st" x="40" y="186" width="200" height="24" rx="6" fill="#fb923c" stroke="#fb923c" stroke-opacity=".6" style="animation-delay:0.5s"/><text x="252" y="203" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8da2ba">LightGBM rerank</text><rect class="st" x="40" y="220" width="140" height="24" rx="6" fill="#fb923c" stroke="#fb923c" stroke-opacity=".6" style="animation-delay:1.0s"/><text x="192" y="237" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8da2ba">MILP, margin &#8805; 15%</text><rect class="st" x="40" y="254" width="80" height="24" rx="6" fill="#fb923c" stroke="#fb923c" stroke-opacity=".6" style="animation-delay:1.5s"/><text x="132" y="271" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8da2ba">2 add-ons</text><g class="up"><text x="510" y="214" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="52" font-weight="800" fill="#fb923c">+14%</text><text x="512" y="240" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="13" fill="#8da2ba">profit per basket vs ranker</text><text x="512" y="258" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="11" fill="#8da2ba" fill-opacity=".7">(simulated cost and stock)</text></g><rect x="40" y="304" width="110" height="26" rx="13" fill="#fb923c" fill-opacity=".12" stroke="#fb923c" stroke-opacity=".5"/><text x="95.0" y="321" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" fon