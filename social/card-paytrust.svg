<svg xmlns="http://www.w3.org/2000/svg" width="720" height="360" viewBox="0 0 720 360" role="img" aria-label="PayTrust AI payment safety layer for AI agents"><style>@keyframes needle{0%,28%{transform:rotate(-62deg)}33%,61%{transform:rotate(0)}66%,95%{transform:rotate(62deg)}100%{transform:rotate(-62deg)}}.nd{transform-origin:170px 280px;animation:needle 6s ease-in-out infinite}@keyframes lit{0%,30%{fill-opacity:.85}36%,100%{fill-opacity:.08}}.pl{animation:lit 6s infinite}</style><defs><linearGradient id="gauge" gradientUnits="userSpaceOnUse" x1="90" x2="250"><stop offset="0" stop-color="#34d399"/><stop offset=".5" stop-color="#fbbf24"/><stop offset="1" stop-color="#fb7185"/></linearGradient></defs><defs><linearGradient id="bd" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="720" y2="360"><stop offset="0" stop-color="#fb7185"/><stop offset=".5" stop-color="#fb7185" stop-opacity="0"/><stop offset="1" stop-color="#38bdf8"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 360 180" to="360 360 180" dur="8s" repeatCount="indefinite"/></linearGradient></defs><rect width="720" height="360" rx="14" fill="#08111f"/><rect x=".75" y=".75" width="718.5" height="358.5" rx="14" fill="none" stroke="#1d2d44" stroke-width="1.5"/><rect x=".75" y=".75" width="718.5" height="358.5" rx="14" fill="none" stroke="url(#bd)" stroke-width="1.5"/><rect x="20" y="20" width="680" height="30" rx="7" fill="#0f1d31"/><circle cx="40" cy="35" r="5" fill="#fb7185"/><circle cx="58" cy="35" r="5" fill="#fbbf24"/><circle cx="76" cy="35" r="5" fill="#4ade80"/><text x="100" y="40" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" fill="#8da2ba">paytrustai.streamlit.app</text><rect x="626" y="26" width="64" height="18" rx="9" fill="#34d399" fill-opacity=".12" stroke="#34d399" stroke-opacity=".5"/><circle cx="640" cy="35" r="3.5" fill="#34d399" style="transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite"/><circle cx="640" cy="35" r="3.5" fill="#34d399"/><text x="650" y="39" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="10" font-weight="700" fill="#34d399">LIVE</text><text x="40" y="98" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="32" font-weight="800" fill="#e6edf3">PayTrust AI</text><text x="40" y="124" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="12" letter-spacing="2" fill="#fb7185">SHOULD THIS AGENT BE ALLOWED TO PAY?</text><path d="M90 280A80 80 0 0 1 250 280" fill="none" stroke="#1d2d44" stroke-width="14" stroke-linecap="round"/><path d="M90 280A80 80 0 0 1 250 280" fill="none" stroke="url(#gauge)" stroke-width="8" stroke-linecap="round"/><line class="nd" x1="170" y1="280" x2="170" y2="214" stroke="#e6edf3" stroke-width="3" stroke-linecap="round"/><circle cx="170" cy="280" r="7" fill="#e6edf3"/><text x="170" y="178" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11" fill="#8da2ba">risk score 0-100</text><rect class="pl" x="330" y="150" width="150" height="34" rx="17" fill="#34d399" fill-opacity=".08" stroke="#34d399" style="animation-delay:0s"/><text x="405" y="172" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#e6edf3">ALLOW</text><text x="496" y="172" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="12.5" fill="#8da2ba">low risk, within policy</text><rect class="pl" x="330" y="196" width="150" height="34" rx="17" fill="#fbbf24" fill-opacity=".08" stroke="#fbbf24" style="animation-delay:2s"/><text x="405" y="218" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#e6edf3">ASK_USER</text><text x="496" y="218" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="12.5" fill="#8da2ba">medium risk or approval gate</text><rect class="pl" x="330" y="242" width="150" height="34" rx="17" fill="#fb7185" fill-opacity=".08" stroke="#fb7185" style="animation-delay:4s"/><text x="405" y="264" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#e6edf3">DENY</text><text x="496" y="264" font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="12.5" fill="#8da2ba">policy violation or high risk</text><rect x="40" y="304" width="152" height="26" rx="13" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".5"/><text x="116.0" y="321" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11.5" font-weight="700" fill="#e6edf3">IEEE-CIS 590k txns</text><rect x="202" y="304" width="117" height="26" rx="13" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".5"/><text x="260.5" y="321" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11.5" font-weight="700" fill="#e6edf3">ROC-AUC 0.842</text><rect x="329" y="304" width="89" height="26" rx="13" fill="#fb7185" fill-opacity=".12" stroke="#fb7185" stroke-opacity=".5"/><text x="373.5" y="321" text-anchor="middle" font-family="'JetBrains Mono',Consolas,'Courier New',monospace" font-size="11.5" font-weight="700" fill="#e6edf3">128 tests</text></svg>
